<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search agencies · HomeAide.org</title>
  <meta name="description" content="HomeAide.org helps families find Medicare-certified home health agencies using public CMS quality data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  
</head>
<body data-page="search">
  <div id="site-header"></div>
  
<section class="section" style="padding-bottom:0">
  <div class="wrap">
    <p class="kicker">Directory</p>
    <h1 style="font-family:var(--serif)">Search Medicare home health agencies</h1>
    <p class="muted">Data from the CMS Home Health Care Agencies public file (July 2026). Availability is not included — call the agency.</p>
  </div>
</section>
<div class="wrap results-layout">
  <form class="filters" id="search-form">
    <label for="q">City, ZIP, or name</label>
    <input id="q" name="q" type="search">
    <label for="st">State</label>
    <select id="st" name="st"></select>
    <label for="minStar">Minimum star rating</label>
    <select id="minStar">
      <option value="0">Any</option>
      <option value="2">2+</option>
      <option value="3">3+</option>
      <option value="4">4+</option>
      <option value="4.5">4.5+</option>
    </select>
    <label><input type="checkbox" id="hhaOnly"> Lists home health aide services</label>
    <button class="btn" type="submit" style="margin-top:1rem;width:100%">Update results</button>
  </form>
  <div>
    <p id="count" class="muted"></p>
    <div id="results" class="grid-3" style="grid-template-columns:1fr; gap:.75rem"></div>
  </div>
</div>

  <div id="site-footer"></div>
  <script src="assets/app.js"></script>
</body>
</html>
