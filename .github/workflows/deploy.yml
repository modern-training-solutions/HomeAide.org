name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      # wrangler-action probes with `npx --no-install`, which npm treats as an
      # error when Wrangler is not already in node_modules. Install it first.
      - name: Install Wrangler
        run: npm install --no-fund --no-audit wrangler@4
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy source --project-name=homeaide-org --commit-dirty=true
